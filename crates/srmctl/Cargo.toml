[package]
name = "srmctl"
description = "CLI for the system resource manager: run commands inside the budget and see what's using the machine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
srm-proto = { path = "../proto" }
tokio = { version = "1.54.1", features = ["full"] }
which = "8.0.6"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
serde_json = "1.0.154"
