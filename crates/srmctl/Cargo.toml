[package]
name = "srmctl"
description = "CLI for the system resource manager: run commands inside the budget and see what's using the machine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
srm-proto = { path = "../proto" }
tokio = { version = "1.54.1", features = ["full"] }
which = "8.0.6"
